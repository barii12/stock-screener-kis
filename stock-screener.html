<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#667eea">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="주식 스크리너">
  <title>📊 고급 주식 스크리닝 시스템 (KIS API)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Segoe UI', 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 16px;
      padding-top: max(16px, env(safe-area-inset-top));
      padding-bottom: max(16px, env(safe-area-inset-bottom));
      color: #333;
    }

    .container { max-width: 1400px; margin: 0 auto; }

    header { text-align: center; color: white; margin-bottom: 24px; }
    header h1 { font-size: 1.8em; margin-bottom: 6px; font-weight: 700; }
    header p { font-size: 0.9em; opacity: 0.9; }

    .status-bar {
      display: flex; align-items: center; justify-content: center;
      gap: 8px; padding: 8px 14px;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      border-radius: 999px; color: white; font-size: 0.85em;
      margin: 10px auto; max-width: 280px;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .status-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: #ffc107; transition: all 0.3s;
    }
    .status-dot.connected { background: #28a745; box-shadow: 0 0 10px #28a745; }
    .status-dot.disconnected { background: #dc3545; }
    .status-dot.connecting { background: #ffc107; animation: pulse 1.5s infinite; }
    @keyframes pulse { 50% { opacity: 0.4; } }

    .card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
      margin-bottom: 18px;
    }

    .market-context {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
    }

    .context-box {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 14px;
      border-radius: 8px;
      text-align: center;
    }
    .context-box h3 { font-size: 0.85em; opacity: 0.9; margin-bottom: 6px; }
    .context-box .value { font-size: 1.5em; font-weight: 700; }

    .section-title {
      font-size: 1.2em;
      font-weight: 700;
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 2px solid #667eea;
      color: #333;
    }

    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -4px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.92em; min-width: 600px; }
    th { background: #f8f9fa; padding: 10px; text-align: left; font-weight: 600; color: #555; border-bottom: 2px solid #667eea; white-space: nowrap; }
    td { padding: 10px; border-bottom: 1px solid #eee; white-space: nowrap; }
    tr:hover { background: #f8f9fa; }

    .tier-a { color: #dc3545; font-weight: 700; }
    .tier-b { color: #fd7e14; font-weight: 600; }
    .tier-c { color: #ffc107; font-weight: 600; }
    .tier-z { color: #999; text-decoration: line-through; }

    .stock-name { font-size: 1.3em; font-weight: 700; color: #333; margin-bottom: 14px; }

    .analysis-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 14px;
      margin-bottom: 16px;
    }

    .analysis-section { background: #fafbfc; border: 1px solid #eee; border-radius: 8px; padding: 14px; }
    .analysis-section h4 { font-size: 0.95em; font-weight: 700; color: #667eea; margin-bottom: 10px; }
    .analysis-item { margin-bottom: 6px; font-size: 0.9em; line-height: 1.5; word-break: keep-all; }

    .input-section {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }

    .input-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-weight: 600; color: white; font-size: 0.9em; }

    input, select, textarea {
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 1em;
      font-family: inherit;
      width: 100%;
    }
    input:focus, select:focus, textarea:focus { outline: 2px solid rgba(255, 255, 255, 0.7); }
    textarea { resize: vertical; min-height: 60px; }

    .button-group { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
    button {
      flex: 1;
      min-width: 120px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 1em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    button:active { transform: scale(0.98); }
    .btn-primary { background: white; color: #667eea; }
    .btn-primary:hover { box-shadow: 0 6px 18px rgba(0, 0, 0, 0.2); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-secondary { background: rgba(255, 255, 255, 0.2); color: white; border: 1px solid white; }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.3); }

    .status-badge { display: inline-block; padding: 5px 10px; border-radius: 20px; font-size: 0.8em; font-weight: 600; }
    .badge-buy { background: #d4edda; color: #155724; }
    .badge-hold { background: #fff3cd; color: #856404; }
    .badge-sell { background: #f8d7da; color: #721c24; }
    .badge-avoid { background: #e2e3e5; color: #383d41; }

    .warning-box {
      background: #f8d7da;
      border: 1px solid #f5c6cb;
      color: #721c24;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 14px;
      font-size: 0.9em;
    }

    .score-indicator {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px; height: 56px;
      border-radius: 50%;
      font-weight: 700;
      font-size: 1.2em;
      color: white;
      margin: 8px 0;
    }
    .score-80-100 { background: linear-gradient(135deg, #28a745, #20c997); }
    .score-60-79 { background: linear-gradient(135deg, #ffc107, #fd7e14); }
    .score-40-59 { background: linear-gradient(135deg, #fd7e14, #dc3545); }
    .score-below-40 { background: linear-gradient(135deg, #6c757d, #495057); }

    .progress-wrap { background: #eee; border-radius: 8px; overflow: hidden; height: 6px; margin: 10px 0; }
    .progress-bar { height: 100%; background: linear-gradient(90deg, #667eea, #764ba2); width: 0%; transition: width 0.3s; }

    @media (max-width: 600px) {
      body { padding: 12px; }
      header h1 { font-size: 1.4em; }
      .card { padding: 16px; border-radius: 12px; }
      .context-box .value { font-size: 1.3em; }
      .stock-name { font-size: 1.1em; }
      .button-group button { padding: 13px; font-size: 0.95em; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📊 고급 주식 스크리닝 시스템</h1>
      <p>한국투자증권 OPEN API · 미너비니 + 사이먼스 분석</p>
      <div class="status-bar">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">서버 연결 중...</span>
      </div>
    </header>

    <div class="card" style="background: rgba(255,255,255,0.08); box-shadow: none; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.15);">
      <div class="input-section">
        <div class="input-group">
          <label>KOSPI 등락률 (%)</label>
          <input type="number" id="kospiChange" placeholder="0" value="0" step="0.1" inputmode="decimal">
        </div>
        <div class="input-group">
          <label>KOSDAQ 등락률 (%)</label>
          <input type="number" id="kosdaqChange" placeholder="0" value="0" step="0.1" inputmode="decimal">
        </div>
        <div class="input-group">
          <label>주도 섹터 (쉼표 구분)</label>
          <input type="text" id="leadingSector" placeholder="IT,Bio,Energy">
        </div>
        <div class="input-group">
          <label>시장 강도</label>
          <select id="marketStrength">
            <option value="bull">강세장 (Bull)</option>
            <option value="neutral" selected>중립</option>
            <option value="bear">약세장 (Bear)</option>
          </select>
        </div>
      </div>

      <div class="input-section">
        <div class="input-group" style="grid-column: 1 / -1;">
          <label>분석할 종목 (쉼표 구분 — 종목명 또는 6자리 코드)</label>
          <textarea id="stockList" placeholder="예: 삼성전자, 카카오, 005930, 크래프톤"></textarea>
        </div>
      </div>

      <div class="button-group">
        <button class="btn-secondary" id="autoAnalyzeBtn" onclick="autoAnalyzeMarket()">📊 시장 자동 분석</button>
        <button class="btn-primary" id="analyzeBtn" onclick="analyzeStocks()">🔍 분석 시작</button>
        <button class="btn-secondary" onclick="resetForm()">초기화</button>
      </div>
    </div>

    <div class="card" id="marketContextCard" style="display: none;">
      <h2 class="section-title">📍 시장 컨텍스트</h2>
      <div class="market-context">
        <div class="context-box"><h3>KOSPI</h3><div class="value" id="contextKospi">+0.0%</div></div>
        <div class="context-box"><h3>KOSDAQ</h3><div class="value" id="contextKosdaq">+0.0%</div></div>
        <div class="context-box"><h3>시장 강도</h3><div class="value" id="contextStrength">중립</div></div>
        <div class="context-box"><h3>주도 섹터</h3><div class="value" id="contextSector">IT</div></div>
      </div>
    </div>

    <div class="card" id="progressCard" style="display: none;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
        <strong id="progressLabel">분석 진행 중...</strong>
        <span id="progressCount" style="color: #667eea; font-weight: 600;">0 / 0</span>
      </div>
      <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
      <div id="progressMessage" style="font-size: 0.85em; color: #777; margin-top: 8px;"></div>
    </div>

    <div class="card" id="tierListCard" style="display: none;">
      <h2 class="section-title">🎯 티어별 종목 리스트</h2>
      <div class="table-wrap">
        <table id="tierTable">
          <thead>
            <tr>
              <th>티어</th>
              <th>종목명</th>
              <th>현재가</th>
              <th>등락률</th>
              <th>거래량 배수</th>
              <th>신호</th>
              <th>점수</th>
              <th>신뢰도</th>
            </tr>
          </thead>
          <tbody id="tierTableBody"></tbody>
        </table>
      </div>
    </div>

    <div id="detailAnalysisContainer"></div>

    <div class="card" id="actionPlanCard" style="display: none;">
      <h2 class="section-title">⚡ Action Plan</h2>
      <div class="table-wrap">
        <table id="actionTable">
          <thead>
            <tr>
              <th>티어</th>
              <th>종목명</th>
              <th>진입가</th>
              <th>1차 목표</th>
              <th>2차 목표</th>
              <th>손절선</th>
              <th>타임라인</th>
            </tr>
          </thead>
          <tbody id="actionTableBody"></tbody>
        </table>
      </div>
    </div>

    <div class="card" id="monitoringCard" style="display: none;">
      <h2 class="section-title">📌 핵심 모니터링 포인트</h2>
      <div id="monitoringContent"></div>
    </div>
  </div>

  <script>
    const DEFAULT_BACKEND_URL = 'wss://stock-screener-kis-1.onrender.com';
    let BACKEND_URL = localStorage.getItem('kis_backend_url') || DEFAULT_BACKEND_URL;

    let ws = null;
    let allSignals = [];
    let reconnectTimer = null;
    let reconnectAttempts = 0;

    function setStatus(state, text) {
      const dot = document.getElementById('statusDot');
      const txt = document.getElementById('statusText');
      dot.className = 'status-dot ' + state;
      txt.textContent = text;
    }

    function connectWebSocket() {
      if (ws && (ws.readyState === WebSocket.CONNECTING || ws.readyState === WebSocket.OPEN)) return;
      clearTimeout(reconnectTimer);
      setStatus('connecting', reconnectAttempts > 0 ? `재연결 중... (${reconnectAttempts})` : '서버 연결 중...');

      try {
        ws = new WebSocket(BACKEND_URL);
      } catch (e) {
        setStatus('disconnected', '연결 실패');
        return;
      }

      ws.onopen = () => {
        reconnectAttempts = 0;
        setStatus('connected', '서버 연결됨 ✓');
      };
      ws.onerror = () => console.error('WebSocket 오류');
      ws.onclose = () => {
        setStatus('disconnected', '서버 연결 끊김 — 재시도 중...');
        reconnectAttempts++;
        const delay = Math.min(2000 * reconnectAttempts, 15000);
        reconnectTimer = setTimeout(connectWebSocket, delay);
      };
    }

    function saveInputs() {
      const data = {
        kospiChange: document.getElementById('kospiChange').value,
        kosdaqChange: document.getElementById('kosdaqChange').value,
        leadingSector: document.getElementById('leadingSector').value,
        marketStrength: document.getElementById('marketStrength').value,
        stockList: document.getElementById('stockList').value,
      };
      localStorage.setItem('kis_last_inputs', JSON.stringify(data));
    }

    function restoreInputs() {
      try {
        const data = JSON.parse(localStorage.getItem('kis_last_inputs') || '{}');
        if (data.kospiChange != null) document.getElementById('kospiChange').value = data.kospiChange;
        if (data.kosdaqChange != null) document.getElementById('kosdaqChange').value = data.kosdaqChange;
        if (data.leadingSector) document.getElementById('leadingSector').value = data.leadingSector;
        if (data.marketStrength) document.getElementById('marketStrength').value = data.marketStrength;
        if (data.stockList) document.getElementById('stockList').value = data.stockList;
      } catch(e) {}
    }

    function showProgress(current, total, message) {
      document.getElementById('progressCard').style.display = 'block';
      document.getElementById('progressCount').textContent = `${current} / ${total}`;
      document.getElementById('progressBar').style.width = (total > 0 ? (current / total) * 100 : 0) + '%';
      document.getElementById('progressMessage').textContent = message || '';
    }

    function hideProgress() {
      document.getElementById('progressCard').style.display = 'none';
    }

    // 📊 시장 자동 분석 함수
    async function autoAnalyzeMarket() {
      const btn = document.getElementById('autoAnalyzeBtn');
      btn.disabled = true;
      btn.textContent = '⏳ 시장 분석 중...';
      showProgress(0, 10, '📊 시장 데이터 수집 중...');

      if (!ws || ws.readyState !== WebSocket.OPEN) {
        connectWebSocket();
        const waited = await waitForConnection(10000);
        if (!waited) {
          hideProgress();
          btn.disabled = false;
          btn.textContent = '📊 시장 자동 분석';
          alert('서버 연결 실패. 다시 시도해주세요.');
          return;
        }
      }

      const marketHandler = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.type === 'marketAnalysis') {
            ws.removeEventListener('message', marketHandler);
            const marketData = data.data;
            
            document.getElementById('kospiChange').value = marketData.kospiChange.toFixed(2);
            document.getElementById('kosdaqChange').value = '0';
            document.getElementById('leadingSector').value = marketData.leadingSector;
            document.getElementById('marketStrength').value = marketData.marketStrength;
            
            updateMarketContext(marketData.kospiChange, 0, marketData.leadingSector, marketData.marketStrength);
            
            let sectorInfo = '';
            for (const [sector, perf] of Object.entries(marketData.analysis.sectorPerformance)) {
              const arrow = perf > 0 ? '📈' : '📉';
              sectorInfo += `${arrow} ${sector}: ${perf.toFixed(2)}%\n`;
            }
            
            hideProgress();
            btn.disabled = false;
            btn.textContent = '📊 시장 자동 분석';
            
            alert(
              `✅ 시장 분석 완료!\n\n` +
              `🎯 시장강도: ${({ 'bull': '강세장 🔥', 'neutral': '중립 ⚖️', 'bear': '약세장 ❄️' }[marketData.marketStrength])}\n` +
              `📊 KOSPI: ${marketData.kospiChange.toFixed(2)}%\n` +
              `🏆 주도섹터: ${marketData.leadingSector}\n\n` +
              `📈 섹터별 상승률:\n${sectorInfo}`
            );
            saveInputs();
          } else if (data.type === 'error') {
            ws.removeEventListener('message', marketHandler);
            hideProgress();
            btn.disabled = false;
            btn.textContent = '📊 시장 자동 분석';
            alert('❌ ' + data.message);
          }
        } catch (e) {
          console.error('응답 처리 오류:', e);
        }
      };

      ws.addEventListener('message', marketHandler);
      ws.send(JSON.stringify({ type: 'analyzeMarket' }));
    }

    function waitForConnection(timeoutMs) {
      return new Promise((resolve) => {
        const start = Date.now();
        const check = () => {
          if (ws && ws.readyState === WebSocket.OPEN) return resolve(true);
          if (Date.now() - start > timeoutMs) return resolve(false);
          setTimeout(check, 300);
        };
        check();
      });
    }

    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

    function updateMarketContext(kospi, kosdaq, sector, strength) {
      document.getElementById('marketContextCard').style.display = 'block';
      document.getElementById('contextKospi').textContent = (kospi > 0 ? '+' : '') + kospi.toFixed(2) + '%';
      document.getElementById('contextKosdaq').textContent = (kosdaq > 0 ? '+' : '') + kosdaq.toFixed(2) + '%';
      let strengthText = '중립';
      if (strength === 'bull') strengthText = '강세장';
      if (strength === 'bear') strengthText = '약세장';
      document.getElementById('contextStrength').textContent = strengthText;
      document.getElementById('contextSector').textContent = sector || 'IT';
    }

    // 종목 분석 시작
    async function analyzeStocks() {
      const kospiChange = parseFloat(document.getElementById('kospiChange').value) || 0;
      const kosdaqChange = parseFloat(document.getElementById('kosdaqChange').value) || 0;
      const leadingSector = document.getElementById('leadingSector').value;
      const marketStrength = document.getElementById('marketStrength').value;
      const stockList = document.getElementById('stockList').value
        .split(/[,\n]/).map(s => s.trim()).filter(s => s);

      if (stockList.length === 0) {
        alert('분석할 종목을 1개 이상 입력해주세요.');
        return;
      }

      saveInputs();
      updateMarketContext(kospiChange, kosdaqChange, leadingSector, marketStrength);

      const btn = document.getElementById('analyzeBtn');
      btn.disabled = true;
      btn.textContent = '⏳ 분석 중...';

      document.getElementById('tierListCard').style.display = 'none';
      document.getElementById('actionPlanCard').style.display = 'none';
      document.getElementById('monitoringCard').style.display = 'none';
      document.getElementById('detailAnalysisContainer').innerHTML = '';
      allSignals = [];

      if (!ws || ws.readyState !== WebSocket.OPEN) {
        showProgress(0, stockList.length, '🌐 서버 연결을 기다리는 중...');
        connectWebSocket();
        const waited = await waitForConnection(60000);
        if (!waited) {
          hideProgress();
          btn.disabled = false;
          btn.textContent = '🔍 분석 시작';
          alert('서버 연결에 실패했습니다.');
          return;
        }
      }

      for (let i = 0; i < stockList.length; i++) {
        const stockName = stockList[i];
        showProgress(i, stockList.length, `🔍 ${stockName} 분석 중...`);
        const signal = await analyzeStockAdvanced(stockName, { kospiChange, kosdaqChange, leadingSector, marketStrength });
        if (signal) allSignals.push(signal);
        if (i < stockList.length - 1) await sleep(250);
      }

      showProgress(stockList.length, stockList.length, '✅ 분석 완료');
      setTimeout(hideProgress, 1500);

      displayResults();
      btn.disabled = false;
      btn.textContent = '🔍 분석 시작';
    }

    function analyzeStockAdvanced(stockName, marketContext) {
      return new Promise((resolve) => {
        if (!ws || ws.readyState !== WebSocket.OPEN) return resolve(null);

        const timeout = setTimeout(() => {
          ws.removeEventListener('message', handler);
          resolve(null);
        }, 30000);

        const handler = (event) => {
          try {
            const data = JSON.parse(event.data);
            if (data.type === 'signal') {
              clearTimeout(timeout);
              ws.removeEventListener('message', handler);
              resolve({ stockData: data.stockData, signal: data.signal });
            } else if (data.type === 'error') {
              clearTimeout(timeout);
              ws.removeEventListener('message', handler);
              resolve(null);
            }
          } catch(e) {}
        };

        ws.addEventListener('message', handler);
        ws.send(JSON.stringify({ type: 'checkStock', stockName: stockName, marketContext: marketContext }));
      });
    }

    function displayResults() {
      document.getElementById('tierListCard').style.display = 'block';
      const tierTableBody = document.getElementById('tierTableBody');
      tierTableBody.innerHTML = '';

      if (allSignals.length === 0) {
        tierTableBody.innerHTML = '<tr><td colspan="8" style="text-align:center; color:#dc3545; font-weight:bold; padding: 24px;">❌ 분석 결과가 없습니다.</td></tr>';
        return;
      }

      const tierA = allSignals.filter(s => s.signal.tier === 'A').sort((a, b) => b.signal.score - a.signal.score);
      const tierB = allSignals.filter(s => s.signal.tier === 'B').sort((a, b) => b.signal.score - a.signal.score);
      const tierC = allSignals.filter(s => s.signal.tier === 'C').sort((a, b) => b.signal.score - a.signal.score);
      const tierZ = allSignals.filter(s => s.signal.tier === 'Z');

      [...tierA, ...tierB, ...tierC, ...tierZ].forEach(item => {
        const tierClass = 'tier-' + item.signal.tier.toLowerCase();
        let volumeClass = 'volume-normal';
        if (item.signal.analysis?.volumeAnomaly?.anomalyLevel === 'critical') volumeClass = 'volume-critical';
        else if (item.signal.analysis?.volumeAnomaly?.anomalyLevel === 'high') volumeClass = 'volume-high';

        const changeSign = item.stockData.changePercent > 0 ? '+' : '';
        const changeColor = item.stockData.changePercent > 0 ? '#dc3545' : (item.stockData.changePercent < 0 ? '#0d6efd' : '#666');
        const volMultiple = item.signal.analysis?.volumeAnomaly?.volumeMultiple ?? 0;

        const row = '<tr>' +
          '<td class="' + tierClass + '">' + item.signal.tier + '</td>' +
          '<td><strong>' + item.stockData.stockName + '</strong></td>' +
          '<td>₩' + item.stockData.currentPrice.toLocaleString() + '</td>' +
          '<td style="color:' + changeColor + ';font-weight:600;">' + changeSign + item.stockData.changePercent.toFixed(2) + '%</td>' +
          '<td class="' + volumeClass + '">' + volMultiple.toFixed(1) + 'x</td>' +
          '<td><span class="status-badge badge-' + item.signal.status.toLowerCase() + '">' + item.signal.status + '</span></td>' +
          '<td><strong>' + item.signal.score + '</strong>/100</td>' +
          '<td>' + item.signal.confidence + '</td>' +
        '</tr>';
        tierTableBody.innerHTML += row;
      });

      // 모든 티어의 상세 분석 표시 (A/B/C/Z 모두)
      displayDetailAnalysis([...tierA, ...tierB, ...tierC, ...tierZ]);
      displayActionPlan([...tierA, ...tierB, ...tierC]);
      displayMonitoring(tierA);
    }

    function displayDetailAnalysis(signals) {
      const container = document.getElementById('detailAnalysisContainer');
      container.innerHTML = '';
      if (signals.length === 0) return;

      signals.forEach((item, idx) => {
        const signal = item.signal;
        const tech = signal.analysis.technicals;
        const vol = signal.analysis.volumeAnomaly;
        const sec = signal.analysis.sector;
        const rs = signal.analysis.rs;

        let scoreClass = 'score-below-40';
        if (signal.score >= 80) scoreClass = 'score-80-100';
        else if (signal.score >= 60) scoreClass = 'score-60-79';
        else if (signal.score >= 40) scoreClass = 'score-40-59';

        const maText = tech.maAlignment ? '✓ Yes' : '✗ No';
        const smartMoneyText = vol.smartMoneySignal ? '✓ 진입 신호' : '⚠ 모니터링';
        let sectorText = '⚠ 중립';
        if (sec.isLeadingSector) sectorText = '✓ Yes';
        else if (sec.isWeakSector) sectorText = '✗ 약세';

        // 점수 구성
        let scoreBreakdown = '<strong style="color:#667eea;">📊 점수 구성:</strong><br>';
        scoreBreakdown += `기술적: +${tech.score} | 거래량: +${vol.anomalyScore} | 섹터: +${sec.sectorScore} | RS: ${rs.rsRating > 0 ? '+' : ''}${rs.rsRating}<br>`;
        scoreBreakdown += `<strong style="color:#667eea;">합계: ${signal.score}/100</strong>`;

        let html = '<div class="card">' +
          '<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">' +
            '<div class="stock-name">' + item.stockData.stockName + '</div>' +
            '<span class="status-badge badge-' + signal.status.toLowerCase() + '" style="font-size:0.95em; padding:8px 14px;">' + signal.status + '</span>' +
          '</div>' +
          '<div style="display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: start; margin-bottom: 16px;">' +
            '<div class="score-indicator ' + scoreClass + '">' + signal.score + '</div>' +
            '<div style="background: #f8f9fa; padding: 14px; border-radius: 6px; font-size: 0.92em; line-height: 1.8;">' +
              scoreBreakdown +
            '</div>' +
          '</div>' +
          '<div class="analysis-grid">' +
            '<div class="analysis-section">' +
              '<h4>📈 기술적 검증 (+' + tech.score + '점)</h4>' +
              '<div class="analysis-item"><strong>MA 정배열:</strong> ' + maText + '</div>' +
              '<div class="analysis-item"><strong>강도:</strong> ' + tech.strength + '</div>' +
              '<div class="analysis-item" style="color: #667eea; margin-top: 10px; font-size: 0.9em;">' + tech.details.join('<br>') + '</div>' +
            '</div>' +
            '<div class="analysis-section">' +
              '<h4>💧 거래량 이상 (+' + vol.anomalyScore + '점)</h4>' +
              '<div class="analysis-item"><strong>거래량 배수:</strong> ' + vol.volumeMultiple.toFixed(1) + '배</div>' +
              '<div class="analysis-item"><strong>수준:</strong> ' + vol.anomalyLevel.toUpperCase() + '</div>' +
              '<div class="analysis-item"><strong>신호:</strong> ' + smartMoneyText + '</div>' +
              '<div class="analysis-item" style="color: #667eea; margin-top: 10px; font-size: 0.9em;">' + vol.details.join('<br>') + '</div>' +
            '</div>' +
            '<div class="analysis-section">' +
              '<h4>🏢 섹터 순환 (+' + sec.sectorScore + '점)</h4>' +
              '<div class="analysis-item"><strong>현재 섹터:</strong> ' + (item.stockData.sector || '기타') + '</div>' +
              '<div class="analysis-item"><strong>주도 여부:</strong> ' + sectorText + '</div>' +
              '<div class="analysis-item" style="color: #667eea; margin-top: 10px; font-size: 0.9em;">' + sec.details.join('<br>') + '</div>' +
            '</div>' +
            '<div class="analysis-section">' +
              '<h4>📊 상대 강도 (' + (rs.rsRating > 0 ? '+' : '') + rs.rsRating + '점)</h4>' +
              '<div class="analysis-item"><strong>등급:</strong> ' + rs.relativeStrength + '</div>' +
              '<div class="analysis-item" style="color: #667eea; margin-top: 10px; font-size: 0.9em;">' + rs.details.join('<br>') + '</div>' +
            '</div>' +
          '</div>';

        if (signal.analysis.cph?.isCupWithHandle) {
          html += '<div class="warning-box">⚠️ Cup with Handle: ' + signal.analysis.cph.handleDepth.toFixed(1) + '% | 신뢰도 ' + signal.analysis.cph.confidence + '%</div>';
        }

        html += '<div style="background: linear-gradient(135deg, #f8f9fa, #eef2ff); padding: 16px; border-radius: 8px; border-left: 4px solid #667eea; margin-top: 14px;">' +
          '<strong style="color: #667eea; display: block; margin-bottom: 10px;">🎯 최종 평가 사유:</strong>' +
          '<div style="font-size: 0.9em; line-height: 1.8; color: #333;">' + signal.reasons.join('<br>') + '</div>' +
        '</div></div>';

        container.innerHTML += html;
      });
    }

    function displayActionPlan(signals) {
      if (signals.length === 0) {
        document.getElementById('actionPlanCard').style.display = 'none';
        return;
      }
      document.getElementById('actionPlanCard').style.display = 'block';
      const tbody = document.getElementById('actionTableBody');
      tbody.innerHTML = '';

      signals.forEach(item => {
        const signal = item.signal;
        const tp = signal.targetPrices;
        const timeline = signal.tier === 'A' ? '즉시 ~ 1주' : (signal.tier === 'B' ? '3 ~ 6주' : '2개월+');

        const row = '<tr>' +
          '<td class="tier-' + signal.tier.toLowerCase() + '"><strong>' + signal.tier + '</strong></td>' +
          '<td>' + item.stockData.stockName + '</td>' +
          '<td>₩' + item.stockData.currentPrice.toLocaleString() + '</td>' +
          '<td style="color:#28a745;font-weight:600;">₩' + Number(tp.tp1).toLocaleString() + '</td>' +
          '<td style="color:#28a745;font-weight:700;">₩' + Number(tp.tp2).toLocaleString() + '</td>' +
          '<td style="color: #dc3545; font-weight: 700;">₩' + Number(tp.stopLoss).toLocaleString() + '</td>' +
          '<td>' + timeline + '</td>' +
        '</tr>';
        tbody.innerHTML += row;
      });
    }

    function displayMonitoring(tierA) {
      const card = document.getElementById('monitoringCard');
      const container = document.getElementById('monitoringContent');

      if (tierA.length === 0) {
        card.style.display = 'none';
        return;
      }

      card.style.display = 'block';
      let html = '';

      tierA.forEach((item, idx) => {
        const signal = item.signal;
        const tp = signal.targetPrices;
        const vol = signal.analysis.volumeAnomaly;

        html += '<div style="background:#f8f9fa; border-left:4px solid #667eea; padding:14px; border-radius:8px; margin-bottom:12px;">' +
          '<div style="font-weight:700; font-size:1.05em; margin-bottom:10px; color:#333;">' +
            '🔥 ' + (idx + 1) + '. ' + item.stockData.stockName + ' (Tier A)' +
          '</div>' +
          '<div style="font-size:0.92em; line-height:1.8; color:#555;">' +
            '<div>📍 진입: ₩' + item.stockData.currentPrice.toLocaleString() + ' (분할 매수)</div>' +
            '<div>🎯 1차: ₩' + Number(tp.tp1).toLocaleString() + ' (+12%) — 50% 매도</div>' +
            '<div>🚀 2차: ₩' + Number(tp.tp2).toLocaleString() + ' (+30%) — 잔여 매도</div>' +
            '<div>🛑 손절: ₩' + Number(tp.stopLoss).toLocaleString() + ' (-7%)</div>' +
            '<div>💧 거래량: ' + vol.volumeMultiple.toFixed(1) + '배</div>' +
          '</div>' +
        '</div>';
      });

      html += '<div style="background:#fff3cd; border:1px solid #ffc107; padding:12px; border-radius:8px; font-size:0.88em; color:#856404; margin-top:10px;">' +
        '💡 <strong>리스크 관리:</strong> 단일 종목 10% 이내 | 손절선 사전 설정 필수' +
      '</div>';

      container.innerHTML = html;
    }

    function resetForm() {
      if (!confirm('초기화할까요?')) return;
      document.getElementById('kospiChange').value = 0;
      document.getElementById('kosdaqChange').value = 0;
      document.getElementById('leadingSector').value = '';
      document.getElementById('marketStrength').value = 'neutral';
      document.getElementById('stockList').value = '';
      document.getElementById('marketContextCard').style.display = 'none';
      document.getElementById('tierListCard').style.display = 'none';
      document.getElementById('actionPlanCard').style.display = 'none';
      document.getElementById('monitoringCard').style.display = 'none';
      document.getElementById('detailAnalysisContainer').innerHTML = '';
      hideProgress();
      allSignals = [];
      localStorage.removeItem('kis_last_inputs');
    }

    ['kospiChange','kosdaqChange','leadingSector','marketStrength','stockList'].forEach(id => {
      document.getElementById(id).addEventListener('change', saveInputs);
    });

    restoreInputs();
    connectWebSocket();

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && (!ws || ws.readyState === WebSocket.CLOSED)) {
        connectWebSocket();
      }
    });
  </script>
</body>
</html>
