<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>고급 주식 스크리닝 시스템 - 미너비니 분석</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', 'Roboto', -apple-system, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      color: #333;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      color: white;
      margin-bottom: 30px;
    }

    header h1 {
      font-size: 2.2em;
      margin-bottom: 5px;
      font-weight: 700;
    }

    header p {
      font-size: 0.95em;
      opacity: 0.9;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      margin-bottom: 20px;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ════════════════════════════════════════════ */
    /* 섹션 1: 시장 컨텍스트                      */
    /* ════════════════════════════════════════════ */
    .market-context {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }

    .context-box {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 16px;
      border-radius: 8px;
      text-align: center;
    }

    .context-box h3 {
      font-size: 0.9em;
      opacity: 0.9;
      margin-bottom: 8px;
    }

    .context-box .value {
      font-size: 1.8em;
      font-weight: 700;
    }

    /* ════════════════════════════════════════════ */
    /* 섹션 2: 티어 분류 및 테이블                */
    /* ════════════════════════════════════════════ */
    .section-title {
      font-size: 1.3em;
      font-weight: 700;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 2px solid #667eea;
      color: #333;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95em;
      margin-bottom: 16px;
    }

    th {
      background: #f8f9fa;
      padding: 12px;
      text-align: left;
      font-weight: 600;
      color: #555;
      border-bottom: 2px solid #667eea;
    }

    td {
      padding: 12px;
      border-bottom: 1px solid #eee;
    }

    tr:hover {
      background: #f8f9fa;
    }

    /* 티어별 색상 */
    .tier-a { color: #dc3545; font-weight: 700; }
    .tier-b { color: #fd7e14; font-weight: 600; }
    .tier-c { color: #ffc107; font-weight: 600; }
    .tier-z { color: #999; text-decoration: line-through; }

    .volume-critical { color: #dc3545; font-weight: 700; }
    .volume-high { color: #fd7e14; font-weight: 600; }
    .volume-normal { color: #28a745; }

    /* ════════════════════════════════════════════ */
    /* 섹션 3: 상세 분석                          */
    /* ════════════════════════════════════════════ */
    .detail-analysis {
      background: #f8f9fa;
      border-left: 4px solid #667eea;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .stock-name {
      font-size: 1.4em;
      font-weight: 700;
      color: #333;
      margin-bottom: 16px;
    }

    .analysis-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-bottom: 20px;
    }

    .analysis-section {
      background: white;
      border: 1px solid #eee;
      border-radius: 8px;
      padding: 16px;
    }

    .analysis-section h4 {
      font-size: 1em;
      font-weight: 700;
      color: #667eea;
      margin-bottom: 12px;
    }

    .analysis-item {
      margin-bottom: 8px;
      font-size: 0.95em;
      line-height: 1.6;
    }

    /* ════════════════════════════════════════════ */
    /* 섹션 4: Action Plan                        */
    /* ════════════════════════════════════════════ */
    .action-plan {
      background: #fff3cd;
      border: 1px solid #ffc107;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .action-plan h4 {
      color: #856404;
      margin-bottom: 12px;
      font-weight: 700;
    }

    .action-item {
      margin-bottom: 10px;
      padding: 8px;
      background: white;
      border-radius: 4px;
      font-size: 0.95em;
    }

    /* ════════════════════════════════════════════ */
    /* 입력 영역                                  */
    /* ════════════════════════════════════════════ */
    .input-section {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-weight: 600;
      color: white;
      font-size: 0.95em;
    }

    input, select {
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 0.95em;
      font-family: inherit;
    }

    input:focus, select:focus {
      outline: 2px solid rgba(255, 255, 255, 0.5);
    }

    .button-group {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 1em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-primary {
      background: white;
      color: #667eea;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: 1px solid white;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    /* ════════════════════════════════════════════ */
    /* 로딩 & 상태                               */
    /* ════════════════════════════════════════════ */
    .spinner {
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top: 3px solid white;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .status-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85em;
      font-weight: 600;
    }

    .badge-buy { background: #d4edda; color: #155724; }
    .badge-hold { background: #fff3cd; color: #856404; }
    .badge-sell { background: #f8d7da; color: #721c24; }
    .badge-avoid { background: #e2e3e5; color: #383d41; }

    /* ════════════════════════════════════════════ */
    /* 반응형                                     */
    /* ════════════════════════════════════════════ */
    @media (max-width: 768px) {
      .analysis-grid {
        grid-template-columns: 1fr;
      }

      header h1 {
        font-size: 1.6em;
      }

      table {
        font-size: 0.85em;
      }

      th, td {
        padding: 8px;
      }
    }

    .info-box {
      background: rgba(255, 255, 255, 0.1);
      border-left: 3px solid white;
      color: white;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 16px;
      font-size: 0.95em;
    }

    .warning-box {
      background: #f8d7da;
      border: 1px solid #f5c6cb;
      color: #721c24;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 16px;
    }

    .score-indicator {
      display: inline-block;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.3em;
      color: white;
      margin: 10px 0;
    }

    .score-80-100 { background: linear-gradient(135deg, #28a745, #20c997); }
    .score-60-79 { background: linear-gradient(135deg, #ffc107, #fd7e14); }
    .score-40-59 { background: linear-gradient(135deg, #fd7e14, #dc3545); }
    .score-below-40 { background: linear-gradient(135deg, #6c757d, #495057); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📊 고급 주식 스크리닝 시스템</h1>
      <p>미너비니 상승 2단계 + 사이먼스 수급 이상 감지 기반</p>
    </header>

    <div class="card" style="background: transparent; box-shadow: none;">
      <div class="input-section">
        <div class="input-group">
          <label>KOSPI 등락률 (%)</label>
          <input type="number" id="kospiChange" placeholder="0" value="0" step="0.1">
        </div>
        <div class="input-group">
          <label>KOSDAQ 등락률 (%)</label>
          <input type="number" id="kosdaqChange" placeholder="0" value="0" step="0.1">
        </div>
        <div class="input-group">
          <label>주도 섹터 (쉼표 구분)</label>
          <input type="text" id="leadingSector" placeholder="IT,BIO,Semiconductors">
        </div>
        <div class="input-group">
          <label>시장 강도</label>
          <select id="marketStrength">
            <option value="bull">강세장 (Bull)</option>
            <option value="neutral" selected>중립</option>
            <option value="bear">약세장 (Bear)</option>
          </select>
        </div>
      </div>

      <div class="input-section">
        <div class="input-group" style="grid-column: 1 / -1;">
          <label>분석할 종목 (쉼표 구분)</label>
          <input type="text" id="stockList" placeholder="삼성전자,카카오,LG화학">
        </div>
      </div>

      <div class="button-group">
        <button class="btn-primary" onclick="analyzeStocks()">🔍 분석 시작</button>
        <button class="btn-secondary" onclick="resetForm()">초기화</button>
      </div>
    </div>

    <div class="card" id="marketContextCard" style="display: none;">
      <h2 class="section-title">📍 시장 컨텍스트</h2>
      <div class="market-context">
        <div class="context-box">
          <h3>KOSPI</h3>
          <div class="value" id="contextKospi">+0.5%</div>
        </div>
        <div class="context-box">
          <h3>KOSDAQ</h3>
          <div class="value" id="contextKosdaq">-0.2%</div>
        </div>
        <div class="context-box">
          <h3>시장 강도</h3>
          <div class="value" id="contextStrength">중립</div>
        </div>
        <div class="context-box">
          <h3>주도 섹터</h3>
          <div class="value" id="contextSector">IT</div>
        </div>
      </div>
    </div>

    <div class="card" id="tierListCard" style="display: none;">
      <h2 class="section-title">🎯 티어별 종목 리스트</h2>
      <table id="tierTable">
        <thead>
          <tr>
            <th>티어</th>
            <th>종목명</th>
            <th>현재가</th>
            <th>등락률</th>
            <th>거래량 배수</th>
            <th>신호</th>
            <th>점수</th>
            <th>신뢰도</th>
          </tr>
        </thead>
        <tbody id="tierTableBody"></tbody>
      </table>
    </div>

    <div id="detailAnalysisContainer"></div>

    <div class="card" id="actionPlanCard" style="display: none;">
      <h2 class="section-title">⚡ Action Plan</h2>
      <table id="actionTable">
        <thead>
          <tr>
            <th>티어</th>
            <th>종목명</th>
            <th>진입 타점</th>
            <th>1차 목표가</th>
            <th>2차 목표가</th>
            <th>손절선</th>
            <th>타임라인</th>
          </tr>
        </thead>
        <tbody id="actionTableBody"></tbody>
      </table>
    </div>

    <div class="card" id="monitoringCard" style="display: none;">
      <h2 class="section-title">📌 핵심 모니터링 포인트</h2>
      <div id="monitoringContent"></div>
    </div>
  </div>

  <script>

    let ws = null;
    let allSignals = [];

    function connectWebSocket() {

      if (ws && (ws.readyState === WebSocket.CONNECTING || ws.readyState ===
